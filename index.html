<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páginas</title>
<meta name="description" content="Coletânea de páginas HTML avulsas.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%84%3C/text%3E%3C/svg%3E">

<script>
  /* Aplica o tema antes da primeira pintura, evitando flash de cor errada. */
  (function () {
    try {
      var t = localStorage.getItem("pages-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   TOKENS
   Contraste verificado em AA (>= 4.5:1) para texto, nos dois temas.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#EEF0F4; --card:#FFFFFF; --sunk:#E3E7ED; --rise:#F7F8FA;
  --ink:#101A26; --muted:#4E5D6E; --faint:#566478;
  --line:#CBD3DD; --line-soft:#DCE2E9;
  --accent:#15697F; --accent-ink:#FFFFFF; --accent-soft:#E3F0F4;
  --shadow-1:0 1px 2px rgba(16,26,38,.06), 0 4px 12px -6px rgba(16,26,38,.14);
  --shadow-2:0 2px 6px rgba(16,26,38,.07), 0 20px 40px -18px rgba(16,26,38,.30);
  --ring:#15697F;
}
:root[data-theme="dark"]{
  --paper:#0B1017; --card:#141B24; --sunk:#1A222D; --rise:#1E2732;
  --ink:#EAEFF5; --muted:#9FAEC0; --faint:#8494A8;
  --line:#28323F; --line-soft:#1F2833;
  --accent:#4FB3CE; --accent-ink:#06131A; --accent-soft:#12303B;
  --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 4px 12px -6px rgba(0,0,0,.6);
  --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 20px 40px -18px rgba(0,0,0,.9);
  --ring:#7FD0E6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1017; --card:#141B24; --sunk:#1A222D; --rise:#1E2732;
    --ink:#EAEFF5; --muted:#9FAEC0; --faint:#8494A8;
    --line:#28323F; --line-soft:#1F2833;
    --accent:#4FB3CE; --accent-ink:#06131A; --accent-soft:#12303B;
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 4px 12px -6px rgba(0,0,0,.6);
    --shadow-2:0 2px 6px rgba(0,0,0,.5), 0 20px 40px -18px rgba(0,0,0,.9);
    --ring:#7FD0E6;
  }
}
:root{
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Bricolage Grotesque',var(--sans);
  --side-w:266px;
  --gap:18px;
  --pad:clamp(16px,2.2vw,32px);
  --r:12px;
  --tap:44px;
}

/* ═══════════════════════════════════════════════════════════════════════
   BASE
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
img{max-width:100%}

/* Anel de foco único e visível em tudo que é interativo. */
:where(a,button,select,input,[tabindex]):focus-visible{
  outline:2px solid var(--ring);outline-offset:2px;border-radius:6px;
}

.skip{
  position:absolute;left:8px;top:-100px;z-index:100;
  background:var(--accent);color:var(--accent-ink);
  padding:12px 18px;border-radius:8px;font-weight:600;text-decoration:none;
  transition:top .15s;
}
.skip:focus{top:8px}

.vh{
  position:absolute!important;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;
}

/* ═══════════════════════════════════════════════════════════════════════
   SHELL — sidebar fixa + coluna fluida, 100% da viewport
   ═══════════════════════════════════════════════════════════════════════ */
.app{
  display:grid;
  grid-template-columns:var(--side-w) minmax(0,1fr);
  min-height:100vh;min-height:100dvh;
}

.side{
  position:sticky;top:0;align-self:start;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--card);border-right:1px solid var(--line-soft);
  padding:22px 18px;gap:20px;overflow-y:auto;overscroll-behavior:contain;
}

.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:29px}
.brand .dot{color:var(--accent)}
.brand .tally{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);
}

.side-sec + .side-sec{margin-top:4px}
.side-sec h2{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin:0 0 8px;padding:0 6px;
}

.filter{
  display:flex;align-items:center;gap:8px;width:100%;
  min-height:38px;padding:7px 10px;border-radius:9px;
  border:1px solid transparent;background:transparent;color:var(--muted);
  font-size:14px;text-align:left;cursor:pointer;
  transition:background .14s,color .14s,border-color .14s;
}
.filter:hover{background:var(--sunk);color:var(--ink)}
.filter .swatch{
  width:8px;height:8px;border-radius:3px;flex:none;
  background:currentColor;opacity:.5;
}
.filter .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter .n{
  font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;
  font-variant-numeric:tabular-nums;
}
.filter[aria-pressed="true"]{
  background:var(--accent-soft);color:var(--ink);
  border-color:color-mix(in srgb, var(--accent) 34%, transparent);
  font-weight:500;
}
.filter[aria-pressed="true"] .swatch{opacity:1;background:var(--accent)}
.filter[aria-pressed="true"] .n{color:var(--accent)}

.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line-soft)}

.seg{display:flex;gap:3px;padding:3px;background:var(--sunk);border-radius:10px}
.seg button{
  flex:1;min-height:32px;padding:5px 6px;border:0;border-radius:7px;
  background:transparent;color:var(--muted);cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  transition:background .14s,color .14s;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1)}

/* ═══════════════════════════════════════════════════════════════════════
   COLUNA PRINCIPAL
   ═══════════════════════════════════════════════════════════════════════ */
.col{display:flex;flex-direction:column;min-width:0}

.topbar{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px var(--pad);
  background:color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
@supports not (backdrop-filter:blur(2px)){ .topbar{background:var(--paper)} }

.search{position:relative;flex:1 1 260px;min-width:0;max-width:520px}
.search .mag{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--faint);pointer-events:none;
}
.search input{
  width:100%;min-height:var(--tap);
  padding:8px 44px 8px 38px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);
  font-size:14.5px;
  transition:border-color .14s,box-shadow .14s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus-visible{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
}
.search input::-webkit-search-cancel-button{filter:grayscale(1);opacity:.6}
.search kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  pointer-events:none;transition:opacity .14s;
}
.search input:focus ~ kbd,.search input:not(:placeholder-shown) ~ kbd{opacity:0}

.ctl{display:flex;align-items:center;gap:6px}
.ctl > span{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);
}
.ctl select{
  min-height:var(--tap);padding:6px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);
  font-size:13.5px;cursor:pointer;
}
.ctl select:hover{border-color:var(--accent)}

.viewtog{display:flex;gap:3px;padding:3px;background:var(--sunk);border-radius:10px}
.viewtog button{
  width:38px;height:38px;display:grid;place-items:center;
  border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;
  transition:background .14s,color .14s;
}
.viewtog button:hover{color:var(--ink)}
.viewtog button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow-1)}
.viewtog svg{width:17px;height:17px}

.mobile-only{display:none}

/* ═══════════════════════════════════════════════════════════════════════
   RESULTADOS
   ═══════════════════════════════════════════════════════════════════════ */
main{flex:1;padding:var(--pad);padding-top:20px}

.status{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:18px;min-height:22px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);
}
.clear{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:4px 11px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
}
.clear:hover{border-color:var(--accent);color:var(--accent)}

.group + .group{margin-top:34px}
.group > h2{
  display:flex;align-items:center;gap:12px;
  font-size:13px;font-family:var(--mono);font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  margin:0 0 14px;
}
.group > h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}

/* ---------- grade ---------- */
.grid{
  display:grid;gap:var(--gap);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));
}

.card{
  position:relative;height:100%;
  display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow-1);
  transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s;
  --a:var(--accent);
}
.card:hover,.card:focus-within{
  transform:translateY(-3px);box-shadow:var(--shadow-2);
  border-color:color-mix(in srgb, var(--a) 50%, var(--line));
}
.card::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;z-index:3;
  background:var(--a);opacity:0;transition:opacity .2s;
}
.card:hover::before,.card:focus-within::before{opacity:1}

.shot{
  position:relative;aspect-ratio:16/10;overflow:hidden;
  background:var(--sunk);border-bottom:1px solid var(--line-soft);
}
.shot iframe,.shot img{position:absolute;inset:0;border:0;display:block;pointer-events:none}
.shot iframe{width:400%;height:400%;max-width:none;max-height:none;transform:scale(.25);transform-origin:0 0;background:#fff}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top center}
.shot .veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,transparent 58%,color-mix(in srgb, var(--card) 80%, transparent));
}
.ph{
  position:absolute;inset:0;display:grid;place-items:center;background:var(--sunk);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);
  transition:opacity .35s;
}
.shot.ready .ph{opacity:0}

/* botão de preview — precisa ficar acima do link esticado do título */
.peek{
  position:absolute;right:10px;top:10px;z-index:4;
  display:inline-flex;align-items:center;gap:6px;
  min-height:32px;padding:6px 11px;border-radius:8px;
  border:1px solid color-mix(in srgb, var(--ink) 14%, transparent);
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--ink);cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s,background .14s;
}
.peek svg{width:13px;height:13px}
.peek:hover{background:var(--card);border-color:var(--a)}
.card:hover .peek,.card:focus-within .peek,.peek:focus-visible{opacity:1;transform:none}
@media (hover:none){ .peek{opacity:1;transform:none} }

.body{display:flex;flex-direction:column;gap:8px;padding:15px 16px 16px;flex:1}
.card .t{font-size:18px}
.card .t a{color:var(--ink);text-decoration:none}
.card .t a::after{content:"";position:absolute;inset:0;z-index:2}
.card .t a:hover{color:var(--accent)}
.d{
  color:var(--muted);font-size:13.5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags li{
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  background:color-mix(in srgb, var(--a) 16%, transparent);
  color:color-mix(in srgb, var(--a) 62%, var(--ink));
}
.foot{
  display:flex;align-items:center;gap:10px;
  margin-top:auto;padding-top:11px;border-top:1px solid var(--line-soft);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);
}
.foot .when{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- lista ---------- */
.rows{
  border:1px solid var(--line-soft);border-radius:var(--r);
  background:var(--card);overflow:hidden;box-shadow:var(--shadow-1);
}
.row{
  position:relative;display:grid;align-items:center;gap:4px 16px;
  grid-template-columns:minmax(0,22ch) minmax(0,1fr) auto auto auto;
  padding:13px 16px;border-top:1px solid var(--line-soft);
  transition:background .14s;
  --a:var(--accent);
}
.row:first-child{border-top:0}
.row:hover,.row:focus-within{background:var(--rise)}
.row .t{font-size:15.5px;font-family:var(--sans);font-weight:600;letter-spacing:-.005em}
.row .t a{color:var(--ink);text-decoration:none}
.row .t a::after{content:"";position:absolute;inset:0;z-index:1}
.row .t a:hover{color:var(--accent)}
.row .d{-webkit-line-clamp:1;line-clamp:1;font-size:13.5px}
.row .tags{justify-content:flex-end}
.row .when{
  font-family:var(--mono);font-size:11px;color:var(--faint);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.row .peek{position:static;opacity:1;transform:none;z-index:2;backdrop-filter:none}
@media (max-width:900px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .d{grid-column:1/-1}
  .row .tags{grid-column:1;justify-content:flex-start}
  .row .when{grid-column:2;text-align:right}
  .row .peek{grid-column:2;justify-self:end}
}

/* ---------- vazio ---------- */
.empty{
  text-align:center;padding:72px 24px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--r);
}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:8px}
.empty code{font-family:var(--mono);font-size:13px;color:var(--accent)}
.empty .clear{margin-top:16px}

footer{
  padding:20px var(--pad) 32px;border-top:1px solid var(--line-soft);
  display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);
}

/* ═══════════════════════════════════════════════════════════════════════
   MODAL DE PREVIEW
   ═══════════════════════════════════════════════════════════════════════ */
dialog{
  width:min(1240px,94vw);height:min(880px,92vh);
  padding:0;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);
  box-shadow:var(--shadow-2);overflow:hidden;
}
dialog::backdrop{background:rgba(6,10,15,.62);backdrop-filter:blur(3px)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--line-soft);background:var(--rise);
}
.dlg-head h2{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-open{
  display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:7px 13px;border-radius:9px;
  background:var(--accent);color:var(--accent-ink);
  text-decoration:none;font-size:13px;font-weight:600;
}
.dlg-open:hover{filter:brightness(1.08)}
.dlg-open svg{width:13px;height:13px}
.dlg-close{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:9px;background:transparent;
  color:var(--muted);cursor:pointer;
}
.dlg-close:hover{color:var(--ink);border-color:var(--accent)}
.dlg-close svg{width:15px;height:15px}
.dlg iframe{flex:1;width:100%;border:0;background:#fff}

/* ═══════════════════════════════════════════════════════════════════════
   RESPONSIVO — a sidebar vira barra compacta com painel de filtros
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{
    position:static;height:auto;
    border-right:0;border-bottom:1px solid var(--line-soft);
    padding:14px var(--pad);gap:14px;overflow:visible;
  }
  .brand{align-items:center}
  .brand h1{font-size:24px}
  .side-head{display:flex;align-items:center;gap:12px;width:100%}
  .side-head .brand{flex:1}
  .mobile-only{display:inline-flex}
  .side-body{display:flex;flex-direction:column;gap:18px}
  .side-body[hidden]{display:none}
  .side-foot{margin-top:0}
  .topbar{padding:10px var(--pad)}
  .search{max-width:none;flex:1 1 100%;order:-1}
}
@media (max-width:560px){
  .ctl > span{display:none}
  .search kbd{display:none}
  .search input{padding-right:14px}
  .grid{grid-template-columns:1fr}
  dialog{width:100vw;height:100dvh;max-width:none;border-radius:0;border:0}
}

.disc{
  display:inline-flex;align-items:center;gap:8px;
  min-height:var(--tap);padding:8px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;font-size:14px;
}
.disc:hover{border-color:var(--accent)}
.disc svg{width:15px;height:15px;transition:transform .18s}
.disc[aria-expanded="true"] svg{transform:rotate(180deg)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .card:hover,.card:focus-within{transform:none}
}
@media (prefers-contrast:more){
  .card,.rows,.search input,.ctl select{border-color:var(--ink)}
  .d,.foot,.status{color:var(--ink)}
}
</style>
</head>
<body>

<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<div class="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="side">
    <div class="side-head">
      <div class="brand">
        <h1>Páginas<span class="dot" aria-hidden="true">.</span></h1>
        <span class="tally" id="tally"></span>
      </div>
      <button class="disc mobile-only" id="drawer" type="button" aria-expanded="false" aria-controls="side-body">
        Filtros
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="side-body" id="side-body">
      <nav class="side-sec" aria-labelledby="lbl-tags">
        <h2 id="lbl-tags">Filtrar por tag</h2>
        <ul id="tagnav"></ul>
      </nav>

      <div class="side-foot">
        <h2 class="vh" id="lbl-tema">Tema</h2>
        <div class="seg" role="group" aria-labelledby="lbl-tema" id="themeseg">
          <button type="button" data-theme="auto"  aria-pressed="false">Auto</button>
          <button type="button" data-theme="light" aria-pressed="false">Claro</button>
          <button type="button" data-theme="dark"  aria-pressed="false">Escuro</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ══════════ COLUNA PRINCIPAL ══════════ -->
  <div class="col">

    <div class="topbar">
      <div class="search">
        <svg class="mag" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="vh" for="q">Buscar página por título, descrição ou tag</label>
        <input id="q" type="search" placeholder="Buscar página…" autocomplete="off" spellcheck="false">
        <kbd aria-hidden="true">/</kbd>
      </div>

      <div class="ctl">
        <span aria-hidden="true">Ordem</span>
        <label class="vh" for="sort">Ordenar por</label>
        <select id="sort">
          <option value="date-desc">Mais recentes</option>
          <option value="date-asc">Mais antigas</option>
          <option value="title-asc">Título A–Z</option>
          <option value="title-desc">Título Z–A</option>
        </select>
      </div>

      <div class="ctl">
        <span aria-hidden="true">Agrupar</span>
        <label class="vh" for="group">Agrupar por</label>
        <select id="group">
          <option value="none">Sem agrupamento</option>
          <option value="year">Por ano</option>
          <option value="tag">Por tag</option>
        </select>
      </div>

      <div class="viewtog" role="group" aria-label="Modo de exibição">
        <button type="button" id="v-grid" data-view="grid" aria-pressed="true" title="Grade" aria-label="Exibir em grade">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        </button>
        <button type="button" id="v-list" data-view="list" aria-pressed="false" title="Lista" aria-label="Exibir em lista">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <main id="conteudo" tabindex="-1">
      <div class="status">
        <span id="count" role="status" aria-live="polite"></span>
        <button class="clear" id="clear" type="button" hidden>Limpar filtros</button>
      </div>
      <div id="results"></div>
    </main>

    <footer>
      <span>By Vinicius Costa</span>
    </footer>

  </div>
</div>

<!-- ══════════ MODAL ══════════ -->
<dialog id="modal" aria-labelledby="dlg-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="dlg-title"></h2>
      <a class="dlg-open" id="dlg-open" href="#">
        Abrir em tela cheia
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M9 6h9v9"/></svg>
      </a>
      <button class="dlg-close" id="dlg-close" type="button" aria-label="Fechar preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <iframe id="dlg-frame" title="Preview da página"></iframe>
  </div>
</dialog>

<script src="pages.js"></script>
<script>
(function () {
  "use strict";

  var LIST = (typeof PAGES !== "undefined" && Array.isArray(PAGES)) ? PAGES : [];

  var $ = function (id) { return document.getElementById(id); };
  var results = $("results"), tagnav = $("tagnav"), qInput = $("q"),
      countEl = $("count"), clearBtn = $("clear"), tally = $("tally"),
      sortSel = $("sort"), groupSel = $("group"), drawer = $("drawer"),
      sideBody = $("side-body"), modal = $("modal"), frame = $("dlg-frame"),
      dlgTitle = $("dlg-title"), dlgOpen = $("dlg-open");

  var state = { q: "", tag: "", view: "grid", sort: "date-desc", group: "none" };
  var observer = null;

  /* ─────────────── utilidades ─────────────── */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  function parts(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || "").trim());
    return m ? { y: m[1], mo: +m[2], d: m[3] } : null;
  }
  function human(d) {
    var p = parts(d);
    return p ? p.d + " " + MESES[p.mo - 1] + " " + p.y : (d ? String(d) : "");
  }
  function iso(d) { return parts(d) ? d : ""; }
  function longDate(d) {
    var p = parts(d);
    var nomes = ["janeiro","fevereiro","março","abril","maio","junho","julho",
                 "agosto","setembro","outubro","novembro","dezembro"];
    return p ? p.d + " de " + nomes[p.mo - 1] + " de " + p.y : "";
  }

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  /* ─────────────── estado na URL ─────────────── */

  function readURL() {
    var p = new URLSearchParams(location.search);
    state.q     = p.get("q") || "";
    state.tag   = p.get("tag") || "";
    state.view  = p.get("view") === "list" ? "list" : "grid";
    state.sort  = ["date-desc", "date-asc", "title-asc", "title-desc"].indexOf(p.get("sort")) >= 0
                    ? p.get("sort") : "date-desc";
    state.group = ["none", "year", "tag"].indexOf(p.get("group")) >= 0 ? p.get("group") : "none";

    // Preferências pessoais valem quando a URL não diz nada.
    if (!p.has("view")) { try { var v = localStorage.getItem("pages-view"); if (v === "list") state.view = "list"; } catch (e) {} }
  }

  function writeURL(push) {
    var p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.tag) p.set("tag", state.tag);
    if (state.view !== "grid") p.set("view", state.view);
    if (state.sort !== "date-desc") p.set("sort", state.sort);
    if (state.group !== "none") p.set("group", state.group);
    var qs = p.toString();
    var url = location.pathname + (qs ? "?" + qs : "");
    if (url === location.pathname + location.search) return;
    history[push ? "pushState" : "replaceState"](null, "", url);
  }

  function syncControls() {
    qInput.value = state.q;
    sortSel.value = state.sort;
    groupSel.value = state.group;
    $("v-grid").setAttribute("aria-pressed", String(state.view === "grid"));
    $("v-list").setAttribute("aria-pressed", String(state.view === "list"));
  }

  /* ─────────────── tema ─────────────── */

  (function theme() {
    var seg = $("themeseg");
    function paint() {
      var cur = document.documentElement.dataset.theme || "auto";
      Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
        b.setAttribute("aria-pressed", String(b.dataset.theme === cur));
      });
    }
    seg.addEventListener("click", function (e) {
      var b = e.target.closest("button[data-theme]");
      if (!b) return;
      var t = b.dataset.theme;
      if (t === "auto") {
        delete document.documentElement.dataset.theme;
        try { localStorage.removeItem("pages-theme"); } catch (err) {}
      } else {
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem("pages-theme", t); } catch (err) {}
      }
      paint();
    });
    paint();
  })();

  /* ─────────────── filtro / ordenação / agrupamento ─────────────── */

  function matches(p) {
    if (state.tag && (p.tags || []).indexOf(state.tag) === -1) return false;
    if (!state.q) return true;
    var hay = [p.title, p.desc, p.file].concat(p.tags || []).filter(Boolean).join(" ");
    return hay.toLowerCase().indexOf(state.q.toLowerCase()) !== -1;
  }

  function sorted(items) {
    var col = new Intl.Collator("pt-BR", { sensitivity: "base" });
    return items.slice().sort(function (a, b) {
      switch (state.sort) {
        case "date-asc":   return (iso(a.date) || "9999").localeCompare(iso(b.date) || "9999");
        case "title-asc":  return col.compare(a.title || a.file, b.title || b.file);
        case "title-desc": return col.compare(b.title || b.file, a.title || a.file);
        default:           return (iso(b.date) || "0000").localeCompare(iso(a.date) || "0000");
      }
    });
  }

  function grouped(items) {
    if (state.group === "none") return [{ label: null, items: items }];

    var buckets = [], index = {};
    function push(key, p) {
      if (!index[key]) { index[key] = { label: key, items: [] }; buckets.push(index[key]); }
      index[key].items.push(p);
    }

    items.forEach(function (p) {
      if (state.group === "year") {
        var pr = parts(p.date);
        push(pr ? pr.y : "Sem data", p);
      } else {
        var ts = p.tags || [];
        if (!ts.length) push("Sem tag", p);
        else ts.forEach(function (t) { push(t, p); });
      }
    });

    if (state.group === "year") {
      buckets.sort(function (a, b) {
        if (a.label === "Sem data") return 1;
        if (b.label === "Sem data") return -1;
        return state.sort === "date-asc" ? a.label.localeCompare(b.label) : b.label.localeCompare(a.label);
      });
    } else {
      var col = new Intl.Collator("pt-BR", { sensitivity: "base" });
      buckets.sort(function (a, b) {
        if (a.label === "Sem tag") return 1;
        if (b.label === "Sem tag") return -1;
        return col.compare(a.label, b.label);
      });
    }
    return buckets;
  }

  /* ─────────────── navegação de tags ─────────────── */

  function buildTagNav() {
    var counts = {}, order = [];
    LIST.forEach(function (p) {
      (p.tags || []).forEach(function (t) {
        if (counts[t] === undefined) { counts[t] = 0; order.push(t); }
        counts[t]++;
      });
    });
    order.sort(new Intl.Collator("pt-BR", { sensitivity: "base" }).compare);

    tagnav.textContent = "";

    function item(value, label, n) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "filter";
      b.dataset.tag = value;
      b.setAttribute("aria-pressed", String(state.tag === value));
      b.innerHTML =
        '<span class="swatch" aria-hidden="true"></span>' +
        '<span class="lbl">' + esc(label) + "</span>" +
        '<span class="n" aria-hidden="true">' + n + "</span>" +
        '<span class="vh">' + plural(n, "página", "páginas") + "</span>";
      b.addEventListener("click", function () {
        state.tag = (state.tag === value) ? "" : value;
        writeURL(true);
        render();
      });
      li.appendChild(b);
      return li;
    }

    tagnav.appendChild(item("", "Todas", LIST.length));
    order.forEach(function (t) { tagnav.appendChild(item(t, t, counts[t])); });
  }

  function paintTagNav() {
    Array.prototype.forEach.call(tagnav.querySelectorAll("button[data-tag]"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.tag === state.tag));
    });
  }

  /* ─────────────── previews sob demanda ─────────────── */

  function setupObserver() {
    if (observer) observer.disconnect();
    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(document.querySelectorAll(".shot[data-src]"), mountPreview);
      return;
    }
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { mountPreview(en.target); observer.unobserve(en.target); }
      });
    }, { rootMargin: "400px 0px" });

    Array.prototype.forEach.call(document.querySelectorAll(".shot[data-src]"), function (el) {
      observer.observe(el);
    });
  }

  function mountPreview(shot) {
    var src = shot.dataset.src;
    if (!src) return;
    delete shot.dataset.src;

    var media;
    if (shot.dataset.thumb) {
      media = document.createElement("img");
      media.src = shot.dataset.thumb;
      media.alt = "";
      media.loading = "lazy";
    } else {
      media = document.createElement("iframe");
      media.src = src;
      media.setAttribute("scrolling", "no");
      media.setAttribute("tabindex", "-1");
      media.setAttribute("aria-hidden", "true");
      media.setAttribute("sandbox", "allow-scripts");
      media.setAttribute("title", "");
      media.setAttribute("loading", "lazy");
    }
    media.addEventListener("load", function () { shot.classList.add("ready"); });
    shot.insertBefore(media, shot.firstChild);
  }

  /* ─────────────── construção dos itens ─────────────── */

  function tagsHTML(p) {
    return (p.tags || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
  }

  function peekHTML(p) {
    return '<button class="peek" type="button" data-peek="' + esc(p.file) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>' +
      "Ver" +
      '<span class="vh"> preview de ' + esc(p.title || p.file) + " sem sair da página</span>" +
      "</button>";
  }

  function cardEl(p, level) {
    var li = document.createElement("li");
    var art = document.createElement("article");
    art.className = "card";
    if (p.accent) art.style.setProperty("--a", p.accent);

    var when = human(p.date);
    art.innerHTML =
      '<div class="shot" data-src="' + esc(p.file) + '"' +
        (p.thumb ? ' data-thumb="' + esc(p.thumb) + '"' : "") + ">" +
        '<span class="ph" aria-hidden="true">preview</span>' +
        '<span class="veil" aria-hidden="true"></span>' +
        peekHTML(p) +
      "</div>" +
      '<div class="body">' +
        "<h" + level + ' class="t"><a href="' + esc(p.file) + '">' + esc(p.title || p.file) + "</a></h" + level + ">" +
        (p.desc ? '<p class="d">' + esc(p.desc) + "</p>" : "") +
        ((p.tags || []).length ? '<ul class="tags" role="list">' + tagsHTML(p) + "</ul>" : "") +
        '<div class="foot">' +
          (when ? '<time class="when" datetime="' + esc(iso(p.date)) + '">' + esc(when) + "</time>" : "") +
        "</div>" +
      "</div>";

    li.appendChild(art);
    return li;
  }

  function rowEl(p, level) {
    var li = document.createElement("li");
    li.className = "row";
    if (p.accent) li.style.setProperty("--a", p.accent);
    var when = human(p.date);
    li.innerHTML =
      "<h" + level + ' class="t"><a href="' + esc(p.file) + '">' + esc(p.title || p.file) + "</a></h" + level + ">" +
      '<p class="d">' + esc(p.desc || "") + "</p>" +
      '<ul class="tags" role="list">' + tagsHTML(p) + "</ul>" +
      (when ? '<time class="when" datetime="' + esc(iso(p.date)) + '">' + esc(when) + "</time>" : "<span></span>") +
      peekHTML(p);
    return li;
  }

  /* ─────────────── render ─────────────── */

  function render() {
    syncControls();
    paintTagNav();

    var items = sorted(LIST.filter(matches));
    var buckets = grouped(items);
    var isGrouped = state.group !== "none";
    var level = isGrouped ? 3 : 2;

    results.textContent = "";

    if (!items.length) {
      var box = document.createElement("div");
      box.className = "empty";
      if (!LIST.length) {
        box.innerHTML = "<h2>Ainda vazio</h2><p>Adicione a primeira página em <code>pages.js</code>.</p>";
      } else {
        box.innerHTML = "<h2>Nada encontrado</h2><p>Nenhuma página bate com a busca ou o filtro atual.</p>";
        var b = document.createElement("button");
        b.className = "clear";
        b.type = "button";
        b.textContent = "Limpar filtros";
        b.addEventListener("click", resetFilters);
        box.appendChild(b);
      }
      results.appendChild(box);
    } else {
      buckets.forEach(function (bucket) {
        var host = results;
        if (isGrouped) {
          var sec = document.createElement("section");
          sec.className = "group";
          var h = document.createElement("h2");
          h.textContent = state.group === "year" ? bucket.label : bucket.label;
          sec.appendChild(h);
          results.appendChild(sec);
          host = sec;
        }
        var ul = document.createElement("ul");
        ul.setAttribute("role", "list");
        if (state.view === "list") {
          ul.className = "rows";
          bucket.items.forEach(function (p) { ul.appendChild(rowEl(p, level)); });
        } else {
          ul.className = "grid";
          bucket.items.forEach(function (p) { ul.appendChild(cardEl(p, level)); });
        }
        host.appendChild(ul);
      });
    }

    var active = state.q || state.tag;
    countEl.textContent = plural(items.length, "página", "páginas") +
      (state.tag ? " · tag “" + state.tag + "”" : "") +
      (state.q ? " · busca “" + state.q + "”" : "");
    clearBtn.hidden = !active;
    tally.textContent = plural(LIST.length, "página", "páginas");

    if (state.view === "grid") setupObserver();
    else if (observer) observer.disconnect();
  }

  function resetFilters() {
    state.q = "";
    state.tag = "";
    writeURL(true);
    render();
    qInput.focus();
  }

  /* ─────────────── modal ─────────────── */

  var supportsDialog = typeof modal.showModal === "function";

  function openPeek(file) {
    var p = null;
    for (var i = 0; i < LIST.length; i++) { if (LIST[i].file === file) { p = LIST[i]; break; } }
    if (!p) return;

    if (!supportsDialog) { window.open(file, "_blank", "noopener"); return; }

    dlgTitle.textContent = p.title || p.file;
    dlgOpen.href = p.file;
    frame.setAttribute("title", "Preview de " + (p.title || p.file));
    frame.src = p.file;
    modal.showModal();
  }

  function closePeek() {
    frame.removeAttribute("src");   // interrompe scripts/áudio da página aberta
    dlgTitle.textContent = "";
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest("[data-peek]") : null;
    if (btn) { e.preventDefault(); openPeek(btn.dataset.peek); }
  });

  $("dlg-close").addEventListener("click", function () { modal.close(); });
  modal.addEventListener("close", closePeek);

  // Clique no backdrop fecha.
  modal.addEventListener("click", function (e) {
    if (e.target === modal) modal.close();
  });

  /* ─────────────── controles ─────────────── */

  var typing = null;
  qInput.addEventListener("input", function () {
    state.q = qInput.value.trim();
    render();
    clearTimeout(typing);
    typing = setTimeout(function () { writeURL(false); }, 350);
  });

  sortSel.addEventListener("change", function () {
    state.sort = sortSel.value; writeURL(true); render();
  });

  groupSel.addEventListener("change", function () {
    state.group = groupSel.value; writeURL(true); render();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function (b) {
    b.addEventListener("click", function () {
      state.view = b.dataset.view;
      try { localStorage.setItem("pages-view", state.view); } catch (e) {}
      writeURL(true);
      render();
    });
  });

  clearBtn.addEventListener("click", resetFilters);

  drawer.addEventListener("click", function () {
    var open = drawer.getAttribute("aria-expanded") === "true";
    drawer.setAttribute("aria-expanded", String(!open));
    sideBody.hidden = open;
  });

  function applyDrawerDefault() {
    var small = window.matchMedia("(max-width: 900px)").matches;
    sideBody.hidden = small && drawer.getAttribute("aria-expanded") !== "true";
    if (!small) { sideBody.hidden = false; drawer.setAttribute("aria-expanded", "false"); }
  }
  window.matchMedia("(max-width: 900px)").addEventListener
    ? window.matchMedia("(max-width: 900px)").addEventListener("change", applyDrawerDefault)
    : window.addEventListener("resize", applyDrawerDefault);

  window.addEventListener("popstate", function () { readURL(); render(); });

  document.addEventListener("keydown", function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    var typingNow = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

    if (e.key === "/" && !typingNow) { e.preventDefault(); qInput.focus(); qInput.select(); }
    if (e.key === "Escape" && document.activeElement === qInput && state.q) {
      e.preventDefault(); state.q = ""; writeURL(false); render(); qInput.focus();
    }
  });

  /* ─────────────── início ─────────────── */

  readURL();
  buildTagNav();
  applyDrawerDefault();
  render();
})();
</script>
</body>
</html>
